<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mimi · Ear Translator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mimi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 한 손 조작용 단일 컬럼. 언어 선택 → 두 개의 큰 모드 버튼 → 번역 결과 */
:root {
  /* 한 가지 룩: 검은 우주 + 빛나는 지구 (밝은/어두운 모드 공통) */
  --bg: #000000;
  --on-bg: #f2f5f7;          /* 배경 위에 바로 놓이는 글자 */
  --on-bg-muted: #8d99a6;
  /* 지구본 */
  --ocean: #0b2443;
  --ocean-deep: #010409;
  --land-dot: #bfefff;       /* 육지 점 입자 */
  --land-dot-warm: #ffd2a0;  /* 도시 불빛처럼 따뜻한 점 */
  --land-fill: rgba(120, 190, 255, 0.07);
  --grid: rgba(140, 190, 255, 0.07);
  --atmo: rgba(80, 160, 255, 0.55);   /* 대기 빛 */
  --route-line: #ffcf7a;
  --pin-from: #7fe3ff;
  --pin-to: #ffb27a;
  --plane: #ffffff;
  /* 카드 (검은 유리) */
  --surface: rgba(14, 18, 26, 0.58);
  --fg: #f2f5f7;
  --muted: #95a1ad;
  --line: rgba(255, 255, 255, 0.10);
  --listen: #5fe0cc;      /* 듣기: 상대 → 내 귀 */
  --listen-soft: rgba(40, 150, 140, 0.20);
  --speak: #ffb27a;       /* 말하기: 나 → 상대 */
  --speak-soft: rgba(255, 150, 80, 0.15);
  --live: #ff6b78;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* hidden 속성이 display 지정보다 우선하도록 */
html, body { margin: 0; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
/* 지구본: 화면 전체 뒤에 깔리고, 위쪽 창에서 드래그·확대한다 */
.globe { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; cursor: grab; touch-action: none; opacity: 0.9; transition: opacity 0.3s; }
.globe.dragging { cursor: grabbing; }
.globe-window {
  height: clamp(124px, 18vh, 190px); display: flex; justify-content: space-between; align-items: flex-end; gap: 8px;
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--on-bg-muted);
}
.globe-window .route-label { color: var(--on-bg); letter-spacing: 0.04em; }
.globe-window .hint { transition: opacity 0.8s; }
.globe-window .hint.faded { opacity: 0; }
.globe-window .hint-touch { display: none; }
@media (pointer: coarse) { .globe-window .hint-mouse { display: none; } .globe-window .hint-touch { display: inline; } }
/* 지구본이 카드 뒤로 비치도록 */
.mode, .live, select, .manual input[type="text"], .manual button { -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
.mode, .live { border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
select option { background: #0e121a; color: var(--fg); }
.wrap {
  pointer-events: none; position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 12px;
}

.wrap > * { pointer-events: auto; }
.wrap > .globe-window { pointer-events: none; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font-size: 1.45rem; font-weight: 500; margin: 0; letter-spacing: 0.01em; color: var(--on-bg); }
/* 지구본 위에 바로 놓인 글자는 밝은 육지 위에서도 읽히도록 그림자를 준다 */
h1, label.field, .globe-window { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7); }
select { text-shadow: none; }
h1 small { font-size: 0.75rem; font-weight: 500; color: var(--on-bg-muted); }

.notice { background: var(--speak-soft); color: var(--fg); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; }

.pair { display: flex; align-items: center; gap: 10px; }
.pair select { flex: 1; }
.fixed-lang {
  padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  white-space: nowrap; text-shadow: none; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.pair-arrow { color: var(--on-bg-muted); font-size: 1.1rem; }
label.field { display: grid; gap: 4px; font-size: 0.78rem; color: var(--on-bg-muted); }
select {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--listen); outline-offset: 2px; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode {
  font: inherit; border: 1px solid transparent; border-radius: 18px; padding: 16px 12px; cursor: pointer;
  display: grid; gap: 4px; justify-items: center; text-align: center; min-height: 84px; align-content: center;
}
.mode:disabled { opacity: 0.45; cursor: not-allowed; }
.mode b { font-size: 1.25rem; font-weight: 600; }
.mode .route { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.mode.listen { background: var(--listen-soft); color: var(--fg); }
.mode.speak { background: var(--speak-soft); color: var(--fg); }
.mode.listen.on { border-color: var(--listen); box-shadow: 0 0 0 1px var(--listen), 0 0 24px rgba(95, 224, 204, 0.25); }
.mode.speak.on { border-color: var(--speak); box-shadow: 0 0 0 1px var(--speak), 0 0 24px rgba(255, 178, 122, 0.25); }
.mode.listen b { color: var(--listen); }
.mode.speak b { color: var(--speak); }
.mode.on .dot { display: inline-block; }
.dot { display: none; width: 9px; height: 9px; border-radius: 50%; background: var(--live); margin-right: 6px; animation: pulse 1.2s infinite; vertical-align: middle; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

.live {
  flex: 1 1 0; min-height: 132px; overflow-y: auto;   /* 남는 공간만 쓰고, 기록이 넘치면 카드 안에서 스크롤 */
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.live-top {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -16px -18px auto;
  padding: 14px 18px 8px; position: sticky; top: -16px; z-index: 1;   /* 기록이 넘쳐 스크롤해도 맨 위에 고정 */
  background: linear-gradient(rgba(10, 13, 19, 0.96) 75%, rgba(10, 13, 19, 0));
}
.live .state { font-size: 0.75rem; color: var(--muted); font-family: var(--font-mono); }
.big-btn {
  font: inherit; font-size: 0.75rem; color: var(--fg); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap;
}
/* 최근 기록: 지난 문장은 작게, 누르면 크게 보기 */
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.history li {
  display: grid; gap: 1px; padding: 6px 10px; border-radius: 10px; border-left: 3px solid var(--listen);
  background: rgba(255, 255, 255, 0.04); cursor: pointer;
}
.history li.speak { border-left-color: var(--speak); }
.history .src { font-size: 0.72rem; color: var(--muted); overflow-wrap: anywhere; }
.history .dst { font-size: 0.88rem; color: var(--fg); overflow-wrap: anywhere; }
.history:empty { display: none; }
.live::after { content: ""; margin-top: auto; }   /* 상태는 카드 맨 위, 번역 내용은 남은 공간 가운데 */
.live .heard { color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
.live .heard:empty, .live .note:empty { display: none; }
.live .out { font-size: clamp(1.6rem, 6.5vw, 2.1rem); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; text-wrap: balance; }
.live .out:empty::before { content: "듣기나 말하기를 누르고 말해 보세요"; font-size: 1rem; font-weight: 400; color: var(--muted); }
.live.show-partner .out { font-size: clamp(1.9rem, 8vw, 2.6rem); color: var(--speak); }
.live .note { font-size: 0.8rem; color: var(--listen); overflow-wrap: anywhere; }
/* 한글 발음: 상대 언어 번역을 내가 직접 따라 말할 수 있게 */
.live .pron { font-size: 1.05rem; color: var(--fg); overflow-wrap: anywhere; }
.live .pron::before { content: "발음"; margin-right: 8px; padding: 1px 7px; border-radius: 6px; font-size: 0.7rem; color: var(--speak); border: 1px solid var(--speak); vertical-align: 2px; }
.live .pron:empty { display: none; }
.replay { display: flex; gap: 8px; flex-wrap: wrap; }
.replay button {
  font: inherit; font-size: 0.8rem; color: var(--fg); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}

/* 크게 보기: 번역문만 화면 가득, 마주 앉은 사람을 위해 뒤집기 가능 */
.showcase {
  position: fixed; inset: 0; z-index: 10; background: #000; color: var(--fg); display: flex; flex-direction: column;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
}
.showcase-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; min-height: 0; transition: transform 0.35s; }
.showcase.flipped .showcase-body { transform: rotate(180deg); }
.showcase-text { margin: 0; font-size: clamp(2.4rem, 11vw, 4.6rem); font-weight: 700; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.showcase.speak .showcase-text { color: var(--speak); }
.showcase-src { margin: 0; font-size: 1rem; color: var(--muted); overflow-wrap: anywhere; }
.showcase-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.showcase-actions button {
  font: inherit; font-size: 1rem; color: var(--fg); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; cursor: pointer;
}
@media (prefers-reduced-motion: reduce) { .showcase-body { transition: none; } }
.privacy { margin: -4px 0 0; text-align: center; text-wrap: balance; font-size: 0.68rem; color: var(--on-bg-muted); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
.manual { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.manual input[type="text"] {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
.manual button {
  font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap;
}

@media (max-width: 300px) { .modes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas class="globe" id="globe" aria-hidden="true"></canvas>
<div class="showcase" id="showcase" role="dialog" aria-modal="true" aria-label="번역 크게 보기" hidden>
  <div class="showcase-body">
    <p class="showcase-text" id="showcaseText"></p>
    <p class="showcase-src" id="showcaseSrc"></p>
  </div>
  <div class="showcase-actions">
    <button type="button" id="showcaseFlip">뒤집기</button>
    <button type="button" id="showcaseClose">닫기</button>
  </div>
</div>
<main class="wrap">
  <header>
    <h1>Mimi <small>耳 · Ear Translator</small></h1>
  </header>

  <section class="globe-window" id="globeWindow" aria-label="지구본: 드래그해서 돌리고 스크롤로 확대">
    <span class="route-label" id="globeRoute">ICN → NRT</span>
    <span class="hint" id="globeHint"><span class="hint-mouse">드래그 회전 · 스크롤 확대 · 더블클릭 원위치</span><span class="hint-touch">밀어서 회전 · 두 손가락 확대</span></span>
  </section>

  <div class="notice" id="notice" hidden></div>

  <section class="settings">
    <label class="field" for="partnerLang">상대방 언어
      <span class="pair">
        <span class="fixed-lang">한국어</span>
        <span class="pair-arrow" aria-hidden="true">⇄</span>
        <select id="partnerLang"></select>
      </span>
    </label>
  </section>

  <section class="live" id="live" aria-live="polite">
    <div class="live-top">
      <span class="state" id="state">대기 중</span>
      <button class="big-btn" id="btnBig" type="button" hidden>크게 보기</button>
    </div>
    <ol class="history" id="history" aria-label="최근 번역"></ol>
    <div class="heard" id="heard"></div>
    <div class="out" id="out"></div>
    <div class="pron" id="pron"></div>
    <div class="note" id="note"></div>
    <div class="replay" id="replay" hidden>
      <button type="button" id="btnReplay">다시 듣기</button>
      <button type="button" id="btnSlow">천천히 듣기</button>
    </div>
  </section>

  <section class="modes">
    <button class="mode listen" id="btnListen" type="button">
      <b><i class="dot"></i>듣기</b>
      <span class="route" id="routeListen">日本語 → 한국어</span>
    </button>
    <button class="mode speak" id="btnSpeak" type="button">
      <b><i class="dot"></i>말하기</b>
      <span class="route" id="routeSpeak">한국어 → 日本語</span>
    </button>
  </section>

  <form class="manual" id="manual">
    <input type="text" id="manualText" placeholder="직접 입력 (언어 자동 감지)" autocomplete="off">
    <button type="submit">번역</button>
  </form>
  <p class="privacy">입력·음성 문장은 번역 서비스(Google·MyMemory·Claude)로 전송됩니다</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="land.js"></script>
<script src="pron.js"></script>
<script>
const LANGS = {
  "ko":    { rec: "ko-KR", label: "한국어", name: "한국어" },
  "ja":    { rec: "ja-JP", label: "日本語", name: "일본어" },
  "en":    { rec: "en-US", label: "English", name: "영어" },
  "zh-CN": { rec: "zh-CN", label: "中文", name: "중국어" },
  "vi":    { rec: "vi-VN", label: "Tiếng Việt", name: "베트남어" },
  "th":    { rec: "th-TH", label: "ภาษาไทย", name: "태국어" },
  "es":    { rec: "es-ES", label: "Español", name: "스페인어" },
  "fr":    { rec: "fr-FR", label: "Français", name: "프랑스어" },
  "de":    { rec: "de-DE", label: "Deutsch", name: "독일어" },
};
const TTS_RATE = 1;     // 음성 속도 (1 = 보통, 낮을수록 느리게)
const $ = (id) => document.getElementById(id);
const els = {
  partner: $("partnerLang"), listen: $("btnListen"), speak: $("btnSpeak"),
  state: $("state"), heard: $("heard"), out: $("out"), pron: $("pron"), note: $("note"), live: $("live"),
  notice: $("notice"), routeL: $("routeListen"), routeS: $("routeSpeak"),
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let mode = null;          // "listen" | "speak" | null
let speaking = false;     // TTS 재생 중이면 마이크를 잠시 끔 (자기 목소리 재인식 방지)

function showNotice(msg) { els.notice.textContent = msg; els.notice.hidden = false; }
function partner() { return els.partner.value; }
const MY_LANG = "ko";     // 한국인 여행자용: 내 언어는 한국어로 고정
function my() { return MY_LANG; }

// 상대방 언어 선택지 채우기 (한국어는 고정이라 빼고, 기본은 일본어)
for (const [code, l] of Object.entries(LANGS)) {
  if (code === MY_LANG) continue;
  els.partner.add(new Option(`${l.name} · ${l.label}`, code));
}
els.partner.value = "ja";

/* ---------- 지구본 ---------- */
// 언어별 대표 공항 [코드, 경도, 위도] (출발 = 내 언어, 도착 = 상대 언어)
const AIRPORT = {
  ko: ["ICN", 126.45, 37.46], ja: ["NRT", 140.39, 35.77], en: ["JFK", -73.78, 40.64],
  "zh-CN": ["PEK", 116.58, 40.08], vi: ["DAD", 108.2, 16.05], th: ["BKK", 100.75, 13.69],
  es: ["MAD", -3.57, 40.47], fr: ["CDG", 2.55, 49.01], de: ["FRA", 8.57, 50.03],
};
const globe = (() => {
  const canvas = $("globe");
  if (!window.d3 || !window.MIMI_LAND) { canvas.hidden = true; return { setRoute() {} }; }   // 오프라인 등으로 못 불러오면 배경만
  const ctx = canvas.getContext("2d");
  const land = { type: "MultiPolygon", coordinates: window.MIMI_LAND };
  const graticule = d3.geoGraticule10();
  const projection = d3.geoOrthographic().clipAngle(90).precision(0.6);
  const path = d3.geoPath(projection, ctx);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PLANE = new Path2D("M10 0 L2 -1.5 L-3 -9 L-5.5 -9 L-2 -1.5 L-7 -1 L-9 -4 L-10.5 -4 L-9.5 0 L-10.5 4 L-9 4 L-7 1 L-2 1.5 L-5.5 9 L-3 9 L2 1.5 Z");
  const OFFSET = 30;        // 비행기를 지구 중심보다 30° 위(= 위쪽 창 한가운데)에 보이게 한다
  const RAD = Math.PI / 180;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const wrap180 = (d) => ((d + 540) % 360) - 180;

  const colors = {};
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["ocean", "ocean-deep", "land-dot", "land-dot-warm", "land-fill", "grid", "atmo", "route-line", "pin-from", "pin-to", "plane", "on-bg"])
    colors[k] = cs.getPropertyValue("--" + k).trim();

  // 육지를 점 입자로: 육지 모양을 작은 캔버스에 칠한 뒤, 고르게 퍼진 경위도 격자점 중 육지 위의 점만 남긴다
  const dots = (() => {
    const w = 1440, h = 720, off = document.createElement("canvas");
    off.width = w; off.height = h;
    const c = off.getContext("2d");
    c.fillStyle = "#fff";
    for (const poly of window.MIMI_LAND) {
      c.beginPath();
      for (const ring of poly) ring.forEach(([lon, lat], i) => {
        const x = (lon + 180) / 360 * w, y = (90 - lat) / 180 * h;
        if (i) c.lineTo(x, y); else c.moveTo(x, y);
      });
      c.fill("evenodd");
    }
    const px = c.getImageData(0, 0, w, h).data, out = [], STEP = 1.15;
    for (let lat = -84; lat <= 84; lat += STEP) {
      const n = Math.max(1, Math.round(360 * Math.cos(lat * RAD) / STEP));
      for (let i = 0; i < n; i++) {
        const lon = -180 + (i + 0.5) * 360 / n;
        const x = Math.min(w - 1, Math.floor((lon + 180) / 360 * w)), y = Math.floor((90 - lat) / 180 * h);

async function fetchJson(url, ms = 6000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
// 1순위: 로컬 서버의 Claude 문맥 번역 / 2순위: 무료 기본 번역 엔진
// 최근 대화를 함께 보내 Claude가 상황(장소, 상대, 말투)을 판단하게 한다
const convo = [];        // [{who: "me"|"partner", text, translation}]
// 번역 서버가 없거나(정적 배포) 키가 없으면 매번 실패를 기다리지 않도록 한동안 건너뛴다
let claudeRetryAt = 0;
async function translateWithClaude(text, from, to) {
  if (Date.now() < claudeRetryAt) return null;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch("/api/translate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, from, to, me: my(), history: convo }), signal: ctl.signal,
    });
    if (r.ok) {
      const j = await r.json();
      return j.text ? { text: j.text, engine: "Claude 문맥 번역", note: j.note || "", pron: j.pronunciation || "" } : null;
    }
    // 404·405·501: 번역 서버가 없는 곳 → 이번 접속 동안 건너뜀 / 503: 키 없음 → 5분 / 그 밖 → 30초
    claudeRetryAt = Date.now() + ([404, 405, 501].includes(r.status) ? Infinity : r.status === 503 ? 300000 : 30000);
  } catch (e) {

async function translate(text, from, to) {
  const claude = await translateWithClaude(text, from, to);
  if (claude) return claude;
  try {
    // dt=rm: 번역문의 로마자 표기도 함께 받는다 (일본어·중국어는 한글 발음으로 바꿀 수 있음)
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&dt=rm&q=${encodeURIComponent(text)}`;
    const j = await fetchJson(u);
    const out = j[0].filter((s) => s[0]).map((s) => s[0]).join("");
    const roman = j[0].filter((s) => s[0] === null && s[2]).map((s) => s[2]).join(" ");
    const pron = to === MY_LANG || !window.MimiPron ? "" : MimiPron.toHangul(to, roman);
    if (out) return { text: out, engine: "기본 번역", note: "", pron };
  } catch (e) { /* 대체 엔진으로 */ }

  const j2 = await fetchJson(u2);

    let guard = setTimeout(resolve, 60000);
    u.onstart = () => { clearTimeout(guard); guard = setTimeout(resolve, 3000 + text.length * 250 / rate); };
    u.onend = u.onerror = () => { clearTimeout(guard); resolve(); };
    speechSynthesis.speak(u);
  }).finally(() => {
    if (gen !== speechGen) return;
    speechPending = Math.max(0, speechPending - 1);
    if (speechPending > 0) return;
    speaking = false;
    if (mode) { resumeRec(); els.state.textContent = stateLabel(); }
  });
}

/* ---------- 파이프라인: 인식된 문장 → 번역 → 출력 ---------- */
// 번역은 바로 시작하되(여러 문장이면 동시에), 화면 표시와 음성은 들어온 순서대로 한다
let outputChain = Promise.resolve();
function pipeline(text, dir) {
  const p = partner(), me = my();
  if (p === me) return Promise.resolve();
  const from = dir === "listen" ? p : me;
  const to = dir === "listen" ? me : p;
  const job = translate(text, from, to);
  job.catch(() => {});   // 차례를 기다리는 동안 '처리되지 않은 오류' 경고가 뜨지 않게
  outputChain = outputChain.then(async () => {
    renderHistory(false);   // 화면에 있던 문장은 최근 기록으로 올린다
    els.heard.textContent = text;
    els.out.textContent = "번역 중…";
    els.note.textContent = "";
    els.pron.textContent = "";
    els.live.classList.toggle("show-partner", dir === "speak");
    let r;
    try { r = await job; }
    catch (e) { els.out.textContent = "번역 실패: 네트워크 연결을 확인하세요."; return; }
    els.out.textContent = r.text;
    els.note.textContent = r.note;
    els.pron.textContent = r.pron || "";
    convo.push({ who: dir === "listen" ? "partner" : "me", text, translation: r.text });
    if (convo.length > 8) convo.shift();
    renderHistory(true);
    current = { text: r.text, src: text, speak: dir === "speak", lang: to, pron: r.pron || "" };
    $("replay").hidden = false;
    $("btnBig").hidden = false;
    els.state.textContent = `${r.engine} · 음성 재생 중`;
    speak(r.text, LANGS[to].rec);   // 기다리지 않음: 음성은 재생 순서대로 이어서 나온다
  });
  return outputChain;
}

/* ---------- 최근 기록 · 크게 보기 ---------- */
let current = null;       // 지금 화면 가운데에 있는 번역 { text, src, speak }
// 지난 번역 최대 4개를 작게 보여준다 (skipLast: 마지막 것은 지금 크게 보이는 문장이라 뺀다)
function renderHistory(skipLast) {
  const list = $("history");
  const past = (skipLast ? convo.slice(0, -1) : convo.slice()).slice(-4);
  list.replaceChildren(...past.map((h) => {
    const li = document.createElement("li");
    if (h.who === "me") li.className = "speak";
    const src = document.createElement("span"); src.className = "src"; src.textContent = h.text;
    const dst = document.createElement("span"); dst.className = "dst"; dst.textContent = h.translation;
    li.append(src, dst);
    li.addEventListener("click", () => openShowcase({ text: h.translation, src: h.text, speak: h.who === "me" }));
    return li;
  }));
  els.live.scrollTop = els.live.scrollHeight;   // 기록이 쌓여 넘치면 가장 최근 문장이 보이게
}
let flipped = false;      // 크게 보기는 항상 똑바로 열고, 뒤집기는 그때만 적용
// 다시 듣기: 원어민 발음으로 한 번 더, 천천히 듣기: 따라 말하기 쉽게 느리게
$("btnReplay").addEventListener("click", () => { if (current) speak(current.text, LANGS[current.lang].rec); });
$("btnSlow").addEventListener("click", () => { if (current) speak(current.text, LANGS[current.lang].rec, 0.65); });
function openShowcase(item) {
  if (!item) return;
  const box = $("showcase");
  $("showcaseText").textContent = item.text;
  $("showcaseSrc").textContent = item.src;
  // 긴 문장은 글자를 줄여 한 화면에 들어가게
  const len = item.text.length;
  $("showcaseText").style.fontSize = len > 70 ? "1.8rem" : len > 40 ? "2.3rem" : len > 20 ? "3rem" : "";
  box.classList.toggle("speak", item.speak);
  flipped = false;
  box.classList.remove("flipped");
  box.hidden = false;
  $("showcaseClose").focus();
}
function closeShowcase() { $("showcase").hidden = true; $("btnBig").focus(); }
$("btnBig").addEventListener("click", () => openShowcase(current));
$("showcaseClose").addEventListener("click", closeShowcase);
$("showcaseFlip").addEventListener("click", () => {
  flipped = !flipped;
  $("showcase").classList.toggle("flipped", flipped);
});
addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("showcase").hidden) closeShowcase(); });

/* ---------- 음성 인식 ---------- */
let recFailures = 0;      // 연속 연결 오류 횟수 (다시 켜는 간격을 늘리는 데 사용)
let reconnecting = false; // "다시 연결하는 중" 안내를 띄웠는지
function stateLabel() {
  const lang = mode === "listen" ? partner() : my();
  return `● 듣는 중 · ${LANGS[lang].label} 인식`;
}
// 마이크 다시 켜기: 연속 오류가 있으면 1초, 2초, 4초… (최대 10초) 기다렸다가 켠다
function resumeRec() {
  const r = rec;
  if (!mode || speaking || !r) return;
  const delay = recFailures ? Math.min(10000, 1000 * 2 ** (recFailures - 1)) : 0;
  setTimeout(() => { if (rec === r && mode && !speaking) try { r.start(); } catch (e) {} }, delay);
}
function start(m) {
  stop();
  if (!SR) return;
  mode = m;
  recFailures = 0;
  rec = new SR();
  rec.lang = LANGS[m === "listen" ? partner() : my()].rec;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (ev) => {
    recFailures = 0;
    if (reconnecting) { reconnecting = false; els.notice.hidden = true; }
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) { const t = r[0].transcript.trim(); if (t) pipeline(t, mode); }
      else interim += r[0].transcript;
    }
    if (interim) { els.heard.textContent = interim; els.out.textContent = "…"; }
  };
  rec.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;   // 조용했거나 재생 때문에 끈 경우: 정상
    const fatal = {
      "not-allowed": "마이크 권한이 거부되었습니다. 주소창의 마이크 아이콘에서 허용해 주세요.",
      "service-not-allowed": "이 브라우저에서는 음성 인식을 쓸 수 없습니다. Chrome으로 열거나 직접 입력을 이용하세요.",
      "audio-capture": "마이크를 찾을 수 없습니다. 마이크나 이어폰 마이크 연결을 확인하세요.",
      "language-not-supported": `이 브라우저는 ${LANGS[m === "listen" ? partner() : my()].label} 음성 인식을 지원하지 않습니다. 직접 입력을 이용하세요.`,
    }[e.error];
    if (fatal) { stop(); showNotice(fatal); return; }
    // network 같은 일시적 오류: 간격을 늘려 다시 시도하고, 5번 연속 실패하면 멈춘다
    recFailures++;
    if (recFailures >= 5) { stop(); showNotice("음성 인식 연결이 계속 실패합니다. 인터넷 연결을 확인한 뒤 버튼을 다시 눌러 주세요."); return; }
    reconnecting = true;
    showNotice("음성 인식 연결이 불안정합니다. 다시 연결하는 중…");
  };
  // Chrome은 침묵이 길면 인식을 끊으므로, 모드가 켜져 있으면 다시 시작
  rec.onend = resumeRec;
  try { rec.start(); } catch (e) {}
  els.listen.classList.toggle("on", m === "listen");
  els.speak.classList.toggle("on", m === "speak");
  els.state.textContent = stateLabel();
}
function stop() {
  mode = null;
  if (rec) { rec.onend = null; rec.onerror = null; try { rec.abort(); } catch (e) {} rec = null; }
  speechGen++; speechPending = 0; speaking = false;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (reconnecting) { reconnecting = false; els.notice.hidden = true; }
  els.listen.classList.remove("on");
  els.speak.classList.remove("on");
  els.state.textContent = "대기 중";
}

// 아이폰 사파리는 화면을 처음 누를 때 음성 출력을 한 번 깨워 둬야 이후 번역 음성이 자동으로 나온다
addEventListener("pointerdown", () => {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(" ");
  u.volume = 0;
  speechSynthesis.speak(u);
}, { once: true });

// 같은 버튼을 다시 누르면 멈춤
els.listen.addEventListener("click", () => mode === "listen" ? stop() : start("listen"));
els.speak.addEventListener("click", () => mode === "speak" ? stop() : start("speak"));
// 입력한 문장이 어느 언어인지 감지해서 방향을 정한다 (내 언어면 말하기, 아니면 듣기)
async function detectLang(text) {
  try {
    const j = await fetchJson(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`, 4000);
    return j[2] || null;
  } catch (e) { return null; }
}
const base = (code) => (code || "").toLowerCase().slice(0, 2);
$("manual").addEventListener("submit", async (e) => {
  e.preventDefault();
  // 한글 입력 중 Enter를 누르면 마지막 글자가 늦게 확정되므로 한 박자 기다린 뒤 읽는다
  await new Promise((r) => setTimeout(r, 0));
  const input = $("manualText");
  const t = input.value.trim();
  if (!t) return;
  input.value = "";
  const lang = await detectLang(t);
  let dir;
  if (lang && base(lang) === base(my())) dir = "speak";
  else if (lang && base(lang) === base(partner())) dir = "listen";
  else dir = /[\uac00-\ud7a3]/.test(t) === (my() === "ko") ? "speak" : "listen";
  pipeline(t, dir);
});
</script>
</body>
</html>
